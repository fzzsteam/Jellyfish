[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:web]
command=/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/celery -A app.core.celery_app:celery_app worker -l info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Celery Beat 调度器。
# 重要：每个部署（集群/主机）只能运行一个 Beat 进程，否则定时任务会被重复触发。
# 若已通过 docker-compose 的 celery-beat 服务运行 Beat，请勿在此 supervisord 配置中
# 同时启用本 program；反之单机 supervisord 部署才使用本节。
[program:beat]
command=/app/.venv/bin/celery -A app.core.celery_app:celery_app beat -l info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
