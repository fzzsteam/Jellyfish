[supervisord]
nodaemon=true
logfile=/var/log/jellyfish/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3

[program:log-tail]
command=/bin/sh -c 'touch /var/log/jellyfish/web/stdout.log /var/log/jellyfish/web/stderr.log /var/log/jellyfish/worker/stdout.log /var/log/jellyfish/worker/stderr.log /var/log/jellyfish/beat/stdout.log /var/log/jellyfish/beat/stderr.log && tail -n 0 -F /var/log/jellyfish/web/stdout.log /var/log/jellyfish/web/stderr.log /var/log/jellyfish/worker/stdout.log /var/log/jellyfish/worker/stderr.log /var/log/jellyfish/beat/stdout.log /var/log/jellyfish/beat/stderr.log'
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/jellyfish/web/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jellyfish/web/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:worker]
command=/app/.venv/bin/celery -A app.core.celery_app:celery_app worker -l info
directory=/app
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/jellyfish/worker/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jellyfish/worker/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

# Celery Beat 调度器。
# 重要：每个部署（集群/主机）只能运行一个 Beat 进程，否则定时任务会被重复触发。
# 若已通过 docker-compose 的 celery-beat 服务运行 Beat，请勿在此 supervisord 配置中
# 同时启用本 program；反之单机 supervisord 部署才使用本节。
[program:beat]
command=/app/.venv/bin/celery -A app.core.celery_app:celery_app beat -l info
directory=/app
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/jellyfish/beat/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/jellyfish/beat/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
